<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
.outer{
		margin:auto;
		margin-top:120px ;
		height:320px;
		width: 400px;
		border: 10px solid black;
		position:relative
	}
p{
		margin-left:80px;
		

	}
.in{
        margin-left:80px;
        padding:10px
	}
#bt{
		margin-top:20px;
		position:absolute;
		left:150px;
	}
#bt:hover{
		background:green;
		font-size:13px;
		cursor:pointer;
		color:white;
	}
</style>
<script>
		function fa(){
		if(a.value==""||b.value==""){
				f()
				document.getElementById("a").style.border="3px solid red"
				document.getElementById("b").style.border="3px solid red"
				bt.value="Enter Data plzzz"
	}
		else{
				document.getElementById("a").style.border="3px solid green"
				document.getElementById("b").style.border="3px solid green"
				bt.value="Thank You"
				bt.style.left="120px";
	}
	}
		flag=1
		function f(){
		if(flag==1){
				bt.style.left="210px"
                flag=2
	}
		else if(flag==2){
				bt.style.left="80px"
				flag=1
	}
	}
</script>
</head>
<body  style="background-color: darkred;">
<div class="outer" style="background-color: lightpink;">
<h1 style="text-align: center; background-color: pink;">Hover form</h1>
<hr>
<p>Enter Id</p>
<input type="text" class="in" placeholder="Enter Id" id="a"/>
<p>Enter Confirm Pass</p>
<input type="password" class="in" placeholder="Enter Password" id="b"/>
<br>
<input type="submit" onmouseenter="fa()" onclick="alert('Welcome.......')" id="bt"/>
</div>
</body>
</html>
